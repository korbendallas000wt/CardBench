<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Bench — Генератор карточек для настольных игр</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #111827;
        color: #ffffff;
      }

      /* Print styles */
      @media print {
        @page {
          size: A4;
          margin: 5mm;
        }

        body {
          background: white !important;
          color: black !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
          color-adjust: exact !important;
        }

        .print\\:hidden {
          display: none !important;
        }

        .print\\:pt-0 {
          padding-top: 0 !important;
        }

        .print-card-item {
          page-break-inside: avoid;
          -moz-column-break-inside: avoid;
               break-inside: avoid;
        }

        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
      }
    </style>
    <script>
      (function () {
        var reported = {};
        window.addEventListener("error", function (event) {
          if (!event || !event.message) return;
          var key = event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return;
          reported[key] = true;
          try {
            if (window.self !== window.top) {
              window.parent.postMessage({
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack: event.error && event.error.stack ? String(event.error.stack).slice(0, 2000) : ""
                }
              }, "*");
            }
          } catch (e) {}
        });
      })();
    </script>
